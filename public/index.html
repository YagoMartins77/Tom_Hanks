<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Tom Hanks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Catálogo Tom Hanks</h1>
      
      <div class="search-container">
        <i class="fas fa-search lupa-icon"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar filme..." onkeyup="pesquisarFilme()">
      </div>

      <div class="user-menu">
        <span id="userName"></span>
        <button onclick="fazerLogout()" class="btn-sair">Sair</button>
      </div>
    </div>
  </header>

  <!-- Mensagem de Confirmação (Toast) -->
  <div id="toastMensagem" class="toast hidden"></div>

  <main>
    <div id="listaFilmes" class="grid-filmes">
      <!-- Os cartões (botões) serão gerados aqui -->
    </div>
  </main>

  <!-- Cartão Expandido (Modal) -->
  <div id="filmeModal" class="modal hidden">
    <div class="modal-content">
      <span class="fechar-modal" onclick="fecharModal()">&times;</span>
      
      <div class="modal-body">
        <img id="modalPoster" src="" alt="Poster do Filme">
        <div class="modal-info">
          
          <!-- Título e Estrela lado a lado -->
          <div class="modal-header-top">
            <h2 id="modalTitulo"></h2>
            <i id="modalEstrela" class="far fa-star estrela-btn-modal" onclick="toggleFavoritoModal()"></i>
          </div>

          <h3>Sinopse</h3>
          <p id="modalSinopse">Sinopse não disponível.</p>
          
          <hr>
          
          <h3>Comentários</h3>
          <div id="listaComentarios" class="comentarios-container"></div>
          
          <div class="comentario-form">
            <input type="text" id="novoComentario" placeholder="Escreva um comentário...">
            <button onclick="adicionarComentario()">Comentar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let filmesGlobais = [];
    let favoritosIds = new Set();
    let filmeAtualExpandido = null;

    // Inicia a tela
    async function iniciarCatalogo() {
      try {
        const userRes = await fetch('/api/auth/me');
        if (!userRes.ok) return window.location.href = 'auth.html';
        const user = await userRes.json();
        document.getElementById('userName').textContent = `Olá, ${user.nome}`;

        const favRes = await fetch('/api/favoritos');
        if (favRes.ok) {
          const favoritos = await favRes.json();
          favoritos.forEach(f => favoritosIds.add(f.tmdb_movie_id));
        }

        const filmesRes = await fetch('/api/filmes');
        if (filmesRes.ok) {
          filmesGlobais = await filmesRes.json();
          renderizarFilmes(filmesGlobais);
        }
      } catch (err) {
        mostrarToast('Erro ao carregar o catálogo', 'erro');
      }
    }

    // Renderiza os filmes
    function renderizarFilmes(filmes) {
      const container = document.getElementById('listaFilmes');
      container.innerHTML = '';

      filmes.forEach(filme => {
        if (!filme.poster_path) return;

        const cartao = document.createElement('div');
        cartao.className = 'filme-card';
        cartao.onclick = () => abrirModal(filme); // O cartão todo é clicável

        cartao.innerHTML = `
          <div class="poster-container">
            <img src="https://image.tmdb.org/t/p/w500${filme.poster_path}" alt="${filme.title}">
          </div>
          <div class="card-info">
            <h3>${filme.title}</h3>
            <p>${filme.release_date ? filme.release_date.split('-')[0] : ''}</p>
          </div>
        `;
        container.appendChild(cartao);
      });
    }

    // Lupa de pesquisa
    function pesquisarFilme() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      const filmesFiltrados = filmesGlobais.filter(filme => 
        filme.title.toLowerCase().includes(termo)
      );
      renderizarFilmes(filmesFiltrados);
    }

    // Abrir o Modal
    function abrirModal(filme) {
      filmeAtualExpandido = filme;
      document.getElementById('modalTitulo').textContent = filme.title;
      document.getElementById('modalSinopse').textContent = filme.overview || 'Sinopse não disponível.';
      document.getElementById('modalPoster').src = `https://image.tmdb.org/t/p/w500${filme.poster_path}`;
      
      const modalEstrela = document.getElementById('modalEstrela');
      if (favoritosIds.has(filme.id)) {
        modalEstrela.className = 'fas fa-star fav-active estrela-btn-modal';
      } else {
        modalEstrela.className = 'far fa-star fav-inactive estrela-btn-modal';
      }
      
      document.getElementById('filmeModal').classList.remove('hidden');
      document.getElementById('novoComentario').value = '';
      
      carregarComentarios(filme.id);
    }

    // Fechar o Modal
    function fecharModal() {
      document.getElementById('filmeModal').classList.add('hidden');
      filmeAtualExpandido = null;
    }

    // Fechar Modal clicando no fundo escuro
    window.addEventListener('click', function(event) {
      const modal = document.getElementById('filmeModal');
      if (event.target === modal) {
        fecharModal();
      }
    });

    // Lógica da Estrela (Favoritos) blindada contra erros
    async function toggleFavoritoModal() {
      if (!filmeAtualExpandido) return;
      
      const id = filmeAtualExpandido.id;
      const modalEstrela = document.getElementById('modalEstrela');
      const isFav = favoritosIds.has(id);

      try {
        if (isFav) {
          const res = await fetch(`/api/favoritos/${id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('Erro ao remover');

          favoritosIds.delete(id);
          modalEstrela.className = 'far fa-star fav-inactive estrela-btn-modal';
          mostrarToast('Removido dos favoritos!');
        } else {
          const res = await fetch('/api/favoritos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              tmdb_movie_id: id, 
              titulo: filmeAtualExpandido.title, 
              poster_path: filmeAtualExpandido.poster_path 
            })
          });
          if (!res.ok) throw new Error('Erro ao favoritar');

          favoritosIds.add(id);
          modalEstrela.className = 'fas fa-star fav-active estrela-btn-modal';
          mostrarToast('Adicionado aos favoritos!');
        }
      } catch (err) {
        mostrarToast('Erro ao atualizar favorito', 'erro');
      }
    }

    // Carregar comentários
    async function carregarComentarios(movieId) {
      const container = document.getElementById('listaComentarios');
      container.innerHTML = 'Carregando...';
      
      try {
        const res = await fetch(`/api/comentarios/${movieId}`);
        if (!res.ok) throw new Error('Erro ao buscar');
        
        const comentarios = await res.json();
        
        container.innerHTML = '';
        if (!Array.isArray(comentarios) || comentarios.length === 0) {
          container.innerHTML = '<p class="sem-comentarios">Seja o primeiro a comentar!</p>';
          return;
        }

        comentarios.forEach(c => {
          const div = document.createElement('div');
          div.className = 'comentario-item';
          div.innerHTML = `<strong>${c.nome}:</strong> <span>${c.texto}</span>`;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = '<p class="sem-comentarios" style="color:#e50914;">Erro ao carregar os comentários.</p>';
      }
    }

    // Adicionar comentário
    async function adicionarComentario() {
      const texto = document.getElementById('novoComentario').value;
      if (!texto.trim() || !filmeAtualExpandido) return;

      try {
        const res = await fetch('/api/comentarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tmdb_movie_id: filmeAtualExpandido.id, texto })
        });

        if (!res.ok) throw new Error('Falha ao postar');

        document.getElementById('novoComentario').value = '';
        carregarComentarios(filmeAtualExpandido.id);
        mostrarToast('Comentário publicado!');
      } catch (err) {
        mostrarToast('Erro ao publicar comentário', 'erro');
      }
    }

    // Toast
    function mostrarToast(mensagem, tipo = 'sucesso') {
      const toast = document.getElementById('toastMensagem');
      toast.textContent = mensagem;
      toast.className = `toast show ${tipo}`;
      setTimeout(() => {
        toast.className = 'toast hidden';
      }, 3000);
    }

    // Logout
    async function fazerLogout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'auth.html';
    }

    iniciarCatalogo();
  </script>
</body>
</html>
