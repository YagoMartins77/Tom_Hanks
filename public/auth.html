<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Catálogo Tom Hanks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2 id="formTitle">Entrar</h2>
    
    <form id="authForm">
      <!-- O campo nome começa com display: none -->
      <input type="text" id="nome" placeholder="Seu Nome" style="display: none;">
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit" id="submitBtn">Entrar</button>
    </form>
    
    <p id="toggleText">
      Não tem uma conta? <a onclick="toggleForm()">Cadastre-se</a>
    </p>
    
    <p id="msgErro" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
  </div>

  <script>
    let isLogin = true;

    // Função que alterna entre Login e Cadastro
    function toggleForm() {
      isLogin = !isLogin;
      const nomeInput = document.getElementById('nome');
      const title = document.getElementById('formTitle');
      const btn = document.getElementById('submitBtn');
      const toggle = document.getElementById('toggleText');
      const msg = document.getElementById('msgErro');
      
      msg.textContent = ''; // Limpa mensagens de erro

      if (isLogin) {
        nomeInput.style.display = 'none'; // Esconde o nome
        nomeInput.required = false;
        title.textContent = 'Entrar';
        btn.textContent = 'Entrar';
        toggle.innerHTML = 'Não tem uma conta? <a onclick="toggleForm()">Cadastre-se</a>';
      } else {
        nomeInput.style.display = 'block'; // Mostra o nome
        nomeInput.required = true;
        title.textContent = 'Cadastrar';
        btn.textContent = 'Cadastrar';
        toggle.innerHTML = 'Já tem uma conta? <a onclick="toggleForm()">Faça Login</a>';
      }
    }

    // Função que envia os dados para o backend
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const msg = document.getElementById('msgErro');

      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
      const body = isLogin ? { email, senha } : { nome, email, senha };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (res.ok) {
          if (isLogin) {
            window.location.href = 'index.html'; // Login ok, vai pro catálogo
          } else {
            msg.style.color = 'green';
            msg.textContent = 'Cadastrado com sucesso! Faça login.';
            setTimeout(() => toggleForm(), 1500); // Volta pra tela de login
          }
        } else {
          msg.style.color = '#e50914';
          msg.textContent = data.error || 'Erro inesperado.';
        }
      } catch (err) {
        msg.style.color = '#e50914';
        msg.textContent = 'Erro de conexão com o servidor.';
      }
    });
  </script>
</body>
</html>
