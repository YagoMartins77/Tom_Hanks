<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes - Tom Hanks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="display: flex; justify-content: space-between; padding: 20px; background: #333; color: white;">
        <h1>Acervo Tom Hanks</h1>
        <div>
            <!-- Este botão só vai aparecer se o usuário for admin -->
            <button id="btn-admin" style="display: none; background: #f39c12; margin-right: 10px;" onclick="carregarLogs()">Painel de Auditoria</button>
            <button onclick="sair()" style="background: #e74c3c;">Sair</button>
        </div>
    </header>

    <main style="padding: 20px;">
        <!-- Área de Logs (Oculta por padrão) -->
        <section id="area-logs" style="display: none; background: #eee; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
            <h2>Auditoria de Sistema</h2>
            <button onclick="fecharLogs()" style="margin-bottom: 10px;">Fechar Painel</button>
            <pre id="conteudo-logs" style="background: #222; color: #0f0; padding: 10px; overflow-x: auto;"></pre>
        </section>

        <!-- Container onde os filmes vão aparecer -->
        <section id="lista-filmes" style="display: flex; gap: 20px; flex-wrap: wrap;">
            <!-- O JavaScript vai injetar os filmes aqui -->
        </section>
    </main>

    <script>
        // Assim que a página carregar, verifica o usuário e carrega os filmes
        document.addEventListener("DOMContentLoaded", async () => {
            verificarSessao();
            carregarFilmes();
        });

        // Simulação de filmes para você não ficar com a tela em branco.
        // Se você tiver uma rota no backend (ex: /api/filmes), substitua esta função por um fetch.
        function carregarFilmes() {
            const filmesTomHanks = [
                { id: 13, titulo: "Forrest Gump", poster: "https://image.tmdb.org/t/p/w200/saHP97rTPS5eLmrLQEcANmKrsFl.jpg" },
                { id: 862, titulo: "Toy Story", poster: "https://image.tmdb.org/t/p/w200/uXDfjJbdP4ijW5hWSBrPrlKpxab.jpg" },
                { id: 8358, titulo: "Náufrago", poster: "https://image.tmdb.org/t/p/w200/1XddJGAI5W3hIq91w4hTfQO5OQh.jpg" }
            ];

            const container = document.getElementById('lista-filmes');
            container.innerHTML = filmesTomHanks.map(filme => `
                <div class="filme-card" style="border: 1px solid #ccc; padding: 10px; border-radius: 8px; width: 220px; text-align: center;">
                    <img src="${filme.poster}" alt="${filme.titulo}" style="width: 100%; border-radius: 5px;">
                    <h3>${filme.titulo}</h3>
                    
                    <button onclick="favoritar(${filme.id}, '${filme.titulo}', '${filme.poster}')" style="width: 100%; margin-bottom: 5px;">⭐ Favoritar</button>
                    
                    <div style="margin-top: 10px; text-align: left;">
                        <input type="text" id="comentario-${filme.id}" placeholder="Escreva um comentário..." style="width: 100%; box-sizing: border-box; margin-bottom: 5px;">
                        <button onclick="comentar(${filme.id})" style="width: 100%;">Comentar</button>
                    </div>
                </div>
            `).join('');
        }

        // Verifica se o usuário está logado e se é Admin
        async function verificarSessao() {
            try {
                // Supondo que você tenha uma rota /api/me para ver quem está logado
                const res = await fetch('/api/me', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = '/auth.html';
                    return;
                }
                const usuario = await res.json();
                
                // Se for admin, mostra o botão de logs
                if (usuario.role === 'admin') {
                    document.getElementById('btn-admin').style.display = 'inline-block';
                }
            } catch (err) {
                console.error("Erro ao verificar sessão");
            }
        }

        // Funções de interação com o backend
        async function favoritar(id, titulo, poster) {
            await fetch('/api/favoritos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tmdb_movie_id: id, titulo: titulo, poster_path: poster }),
                credentials: 'include'
            });
            alert('Ação registrada! Verifique os logs se for admin.');
        }

        async function comentar(filme_id) {
            const input = document.getElementById(`comentario-${filme_id}`);
            const texto = input.value;
            if (!texto) return;

            await fetch('/api/comentarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tmdb_movie_id: filme_id, texto: texto }),
                credentials: 'include'
            });
            input.value = '';
            alert('Comentário enviado!');
        }

        // Lógica de Auditoria (Apenas Admin)
        async function carregarLogs() {
            try {
                const res = await fetch('/api/logs', { credentials: 'include' });
                if (res.ok) {
                    const logs = await res.json();
                    document.getElementById('conteudo-logs').textContent = JSON.stringify(logs, null, 2);
                    document.getElementById('area-logs').style.display = 'block';
                } else {
                    alert('Sem permissão para ver os logs.');
                }
            } catch (err) {
                alert('Erro ao carregar logs.');
            }
        }

        function fecharLogs() {
            document.getElementById('area-logs').style.display = 'none';
        }

        async function sair() {
            // Caso tenha uma rota de logout, chame-a aqui. Depois redirecione.
            window.location.href = '/auth.html';
        }
    </script>
</body>
</html>
