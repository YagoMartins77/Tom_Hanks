<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>Nova Senha</h2>
    <form id="resetForm">
      <input type="password" id="novaSenha" placeholder="Digite a nova senha (mínimo 6 caracteres)" required minlength="6">
      <button type="submit">Salvar Nova Senha</button>
    </form>
    <p id="msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
    <p style="text-align: center; margin-top: 15px;"><a href="auth.html">Voltar para Login</a></p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('novaSenha').value;
      const msg = document.getElementById('msg');

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });

        const data = await res.json();
        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = 'Senha alterada com sucesso! Redirecionando...';
          setTimeout(() => window.location.href = 'auth.html', 2500);
        } else {
          msg.style.color = '#e50914';
          msg.textContent = data.error || 'Erro ao redefinir.';
        }
      } catch (err) {
        msg.style.color = '#e50914';
        msg.textContent = 'Erro ao comunicar com o servidor.';
      }
    });
  </script>
</body>
</html>
